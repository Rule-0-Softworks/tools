name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell checks and tests
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install test tools
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Check PowerShell
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $findings = @(Invoke-ScriptAnalyzer -Path ./powershell -Recurse)
          $findings | Format-Table -AutoSize
          if (@($findings | Where-Object Severity -eq 'Error').Count -gt 0) {
            throw 'PowerShell analysis found errors.'
          }

      - name: Run tests
        run: |
          Import-Module Pester -RequiredVersion 6.2.0
          Invoke-Pester -Path ./tests -CI -Output Detailed
